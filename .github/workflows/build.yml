name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A039D1: ${{ secrets.A039D1 }}
          B7FAE6: ${{ secrets.B7FAE6 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A039D1', '')
          meta_b = os.environ.get('B7FAE6', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 8840702420df9381519a96184045132b714a339f4197ea -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 520ada05fbbcabb072fae6fb -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
